name: Publish App Studio
on:
  push:
    branches: [master]
    paths-ignore: ['README.md']
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test domain and JSON logic
        run: npm test
      - name: Collect free snapshots on first publication
        run: |
          if [ ! -f public/data/manifest.json ]; then python scripts/prepare_data.py; fi
      - name: Validate data
        run: python scripts/validate_data.py
      - name: Persist market JSON and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist validated public market snapshots and dependency lock"
            git push
          fi
      - name: Build Staywise and app collection
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
