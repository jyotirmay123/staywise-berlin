<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#10261f" />
    <title>Aster Portfolio</title>
    <style>
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #10261f;
        color: #fffdf8;
        display: flex;
        font-family: system-ui, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 32px;
        text-align: center;
      }
      main { max-width: 340px; }
      i {
        background: #dbe86f;
        border-radius: 50%;
        display: inline-block;
        height: 42px;
        margin-bottom: 18px;
        width: 42px;
      }
      h1 { font-size: 28px; letter-spacing: -0.04em; margin: 0 0 8px; }
      p { color: #aeb9b5; font-size: 14px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <i></i>
      <h1>Aster needs its site address</h1>
      <p>Build with CAPACITOR_SERVER_URL set to your deployed Aster URL. Cached portfolio remains available after first launch.</p>
    </main>
  </body>
</html>
